<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Prompt Library – Mahamed Muhumed</title>
  <meta name="description" content="A searchable library of prompts for large language models, each annotated with the prompt-engineering techniques it uses.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>AI Prompt Library</h1>
    <p>Prompts I've written for working with large language models — each one annotated with the techniques that make it work.</p>
  </header>

  <main class="container">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search prompts, e.g. 'tests' or 'role'…" aria-label="Search prompts">
      <div id="filters" role="group" aria-label="Filter by category"></div>
    </div>
    <p id="resultCount" aria-live="polite"></p>
    <div id="promptGrid" class="prompt-grid"></div>
  </main>

  <footer>
    Built with plain HTML, CSS and JavaScript by
    <a href="https://github.com/mahamedmuhumed9100-bit">Mahamed Muhumed</a>.
    Text in <mark class="placeholder">[brackets]</mark> is for you to fill in.
  </footer>

  <script src="prompts.js"></script>
  <script src="app.js"></script>
</body>
</html>
